[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-manipulation-il-rl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["mobile_manipulation_il_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["physics: requires MuJoCo", "learning: requires PyTorch/SB3"]

